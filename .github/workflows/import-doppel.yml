name: Import Doppel catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Download website files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Import Doppel products and images
        run: python scripts/import_doppel.py

      - name: Save products and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/products.json images/products
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update Doppel catalogue and images"
            git push
          fi
