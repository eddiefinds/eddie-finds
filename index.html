<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#0b0b0b"
  >

  <title>Eddie Finds</title>

  <meta
    name="description"
    content="Curated product finds across fashion, accessories, electronics and more."
  >

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- HEADER -->

  <header class="site-header">

    <a
      class="brand"
      href="./"
    >
      EDDIE FINDS
    </a>

    <a
      class="header-link"
      href="#catalogue"
    >
      SHOP ALL
    </a>

  </header>



  <main>

    <!-- HERO -->

    <section class="hero">

      <p class="eyebrow">
        CURATED FINDS
      </p>

      <h1>
        Find your next piece.
      </h1>

      <p class="hero-copy">
        Fashion, footwear, watches, electronics
        and more — all in one place.
      </p>

    </section>



    <!-- CATALOGUE -->

    <section
      id="catalogue"
      class="catalogue-shell"
    >


      <!-- SEARCH -->

      <div class="search-row">

        <input
          id="search"
          type="search"
          placeholder="Search products, brands or tags…"
          autocomplete="off"
        >

      </div>



      <!-- CATEGORIES -->

      <div class="category-block">

        <div
          id="categories"
          class="categories"
        ></div>

        <div
          id="subcategories"
          class="subcategories"
        ></div>

      </div>



      <!-- SORTING -->

      <div class="catalogue-meta">

        <span id="count">
          0 items
        </span>


        <select
          id="sort"
          aria-label="Sort products"
        >

          <option value="featured">
            Featured
          </option>

          <option value="newest">
            Newest
          </option>

          <option value="az">
            A–Z
          </option>

          <option value="priceLow">
            Price: Low to High
          </option>

          <option value="priceHigh">
            Price: High to Low
          </option>

        </select>

      </div>



      <!-- LOADING MESSAGE -->

      <div
        id="status"
        class="status"
      >
        Loading catalogue…
      </div>



      <!-- PRODUCTS -->

      <section
        id="grid"
        class="product-grid"
        aria-live="polite"
      ></section>


    </section>

  </main>



  <!-- FOOTER -->

  <footer>

    <div>

      <p class="footer-brand">
        EDDIE FINDS
      </p>

      <p class="footer-copy">
        Curated links across multiple categories.
      </p>

    </div>


    <p class="footer-copy">
      Third-party links may open in a new tab.
    </p>

  </footer>



  <!-- PRODUCT CARD TEMPLATE -->

  <template id="cardTemplate">

    <article class="product-card">


      <!-- PRODUCT IMAGE -->

      <a
        class="image-link"
        target="_blank"
        rel="noopener noreferrer"
      >

        <div class="image-shell">

          <img
            class="product-image"
            loading="lazy"
            alt=""
          >

          <span class="featured-badge">
            FEATURED
          </span>

        </div>

      </a>



      <!-- PRODUCT INFORMATION -->

      <div class="card-body">

        <p class="product-meta"></p>

        <h2 class="product-name"></h2>


        <div class="card-footer">

          <span class="product-price"></span>


          <a
            class="view-button"
            target="_blank"
            rel="noopener noreferrer"
          >
            VIEW ITEM
          </a>

        </div>

      </div>

    </article>

  </template>



  <!-- JAVASCRIPT -->

  <script src="script.js"></script>


</body>

</html>
